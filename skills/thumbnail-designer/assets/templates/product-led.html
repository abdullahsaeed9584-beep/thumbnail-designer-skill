<!doctype html>
<!-- Product-led 16:9. Hero object centre-right on a studio sweep, one callout ring,
     short hook left. Also works for a single data indicator.
     render_html.py product-led.html out.png \
       --var HEADLINE="WORTH" --var KEYWORD="IT?" --var SUBHEAD="90 days later" \
       --var SUBJECT="work/product.png" --var BADGE="TESTED" --var ACCENT="#FF6B2C"
     Add --var RING=1 to show the callout ring, then move it onto the detail it marks. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Product-led thumbnail</title>
<link rel="stylesheet" href="base.css">
<style>
  :root { --accent: {{ACCENT}}; --bg-blur: 0px; --vignette: 0.5; }
  .sweep {
    position: absolute; inset: 0;
    background:
      radial-gradient(60% 55% at 64% 46%, color-mix(in srgb, var(--accent) 20%, transparent) 0%, transparent 70%),
      linear-gradient(160deg, color-mix(in srgb, var(--support) 90%, white 6%) 0%, var(--base) 72%);
  }
  .floor {
    position: absolute; left: 0; right: 0; bottom: 0; height: 34%;
    background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.55) 100%);
  }
  .headline { left: 58px; top: 196px; font-size: 118px; max-width: 470px; }
  .subhead  { position: absolute; left: 62px; top: 150px; font-size: 26px; z-index: 5; }
  .subject  { right: 6%; height: 78%; bottom: 9%; }
  .ring     { right: 7%; top: 12%; width: 150px; height: 150px; }  /* reposition per job */
  .badge    { left: 60px; bottom: 86px; }
  .fg-bokeh.a { right: -30px; bottom: -40px; width: 190px; height: 190px; opacity: .5; }
</style>
</head>
<body>
<div class="stage">
  <div class="sweep"></div>
  <div class="bg bg--sharp" style="background-image:url('{{BG}}')"></div>
  <div class="floor"></div>
  <div class="keylight"></div>

  <div class="subhead">{{SUBHEAD}}</div>
  <h1 class="headline">{{HEADLINE}} <span class="keyword">{{KEYWORD}}</span></h1>

  <img class="subject" src="{{SUBJECT}}" alt="" onerror="this.remove()">
  <div class="ring" data-on="{{RING}}"></div>
  <div class="badge">{{BADGE}}</div>
  <img class="logo" src="{{LOGO}}" alt="" style="right:52px; bottom:120px" onerror="this.remove()">

  <div class="fg-bokeh a"></div>
  <div class="vignette"></div>
  <div class="grain"></div>
  <div class="guides"></div>
</div>
<script>
  document.querySelectorAll('.subhead,.badge,.headline .keyword').forEach(function (el) {
    if (!el.textContent.trim()) el.remove();
  });
  // The callout ring is opt-in (--var RING=1) and must be repositioned to sit on the
  // detail it points at - left at a default it reads as an accidental halo.
  document.querySelectorAll('.ring').forEach(function (el) {
    if (!/^(1|on|true|yes)$/i.test((el.dataset.on || '').trim())) el.remove();
  });
  // No background photo supplied: keep the studio sweep, drop the empty layer.
  document.querySelectorAll('.bg').forEach(function (el) {
    if (/url\(['"]?['"]?\)/.test(el.getAttribute('style') || '')) el.remove();
  });
  var h = document.querySelector('.headline');
  if (h) {
    var size = parseFloat(getComputedStyle(h).fontSize);
    while (size > 52 && (h.scrollHeight > 300 || h.scrollWidth > 486)) {
      size -= 4; h.style.fontSize = size + 'px';
    }
  }
</script>
</body>
</html>
